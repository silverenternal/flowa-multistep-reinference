name: mutation-nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ``mutmut`` is intentionally NOT installed. It cannot run on Windows
      # (upstream boxed/mutmut#397), which made the mutation gate
      # unreproducible for contributors on that platform. The gate now runs
      # ``tools/mutate/ast_mutator.py`` — a stdlib-only AST point mutator that
      # behaves identically on Linux and Windows. It is not a full mutmut
      # replacement (coverage is partial; seven operator families) but it
      # reports the same ``killed / total`` score, so the S-tier thresholds
      # below gate exactly as before. See tools/mutate/WINDOWS_LIMITATION.md.
      - name: Install dependencies
        run: pip install pytest hypothesis pytest-benchmark

      # The mutator drives the full ``tests/`` suite once per mutant, so the
      # critical-path modules are targeted explicitly rather than sweeping
      # every package. ``--jobs`` uses the runner's cores; ``--baseline``
      # regenerates tools/mutate/mutation_baseline.json with the real numbers.
      - name: Run ast_mutator
        run: |
          python tools/mutate/ast_mutator.py run \
            --target adaptive_reflow/frame/merge.py \
            --target adaptive_reflow/frame/channel_rule.py \
            --target adaptive_reflow/eval/claim_gate.py \
            --target adaptive_reflow/schedule/cosine.py \
            --output mutmut_results.json \
            --jobs 4 \
            --baseline

      - name: Mutation summary
        run: python tools/mutate/ast_mutator.py summary mutmut_results.json

      # Mutation-score gate. ``ast_mutator gate`` parses the score out of
      # mutmut_results.json and enforces, at four granularities:
      #
      #   * project-wide         >= 0.50
      #   * ``contracts/`` only  >= 0.75
      #   * ``universal/`` only  >= 0.75
      #   * ``frame/`` only      >= 0.60
      #
      # The contracts / universal thresholds are intentionally stricter
      # because those are the load-bearing typed-contracts modules;
      # regressions there silently weaken the universal contract's
      # compositional guarantees. The frame threshold is slightly lower to
      # acknowledge the larger surface area and the orchestrator branches
      # that are exercised only by the stress-nightly workflow. Per-area
      # thresholds are skipped when a run mutated no modules in that area,
      # so narrowing ``--target`` above cannot accidentally pass a gate it
      # never measured. The rule lives in Python, next to the schema it
      # consumes, so the same command reproduces the verdict locally.
      - name: Compute mutation-score gate
        run: python tools/mutate/ast_mutator.py gate mutmut_results.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutmut_results.json
            tools/mutate/mutation_baseline.json
          if-no-files-found: error
