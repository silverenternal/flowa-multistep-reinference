name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -e .[test] || pip install pytest hypothesis pytest-benchmark ruff mypy mutmut
      - name: Lint with ruff
        run: ruff check adaptive_reflow/ tests/
      - name: Run pytest (non-slow, non-benchmark)
        run: PYTHONPATH=. python -m pytest tests/ -m "not slow and not benchmark" --no-header -q
      - name: Run universal-import guard
        run: PYTHONPATH=. python -m pytest tests/test_universal/test_universal_imports_no_molecular.py --no-header -q
      - name: Check docs against code
        run: PYTHONPATH=. python tools/check_docs_against_code.py