name: cpu-tests

# T-04.2: This workflow predates the canonical ``ci.yml`` (which runs all
# six pre-merge gates) and is kept as a lightweight watchdog so external
# contributors with branch-protection rules pinned to this exact filename
# do not lose coverage. The single ``test_universal/test_universal_imports_no_molecular.py``
# reference on the previous line was a stale filename (the file is
# actually ``test_no_molecular_import.py``) — fixed below. New work
# should target ``ci.yml``; this file is intentionally minimal.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -e .[test] || pip install pytest hypothesis pytest-benchmark ruff mypy mutmut
      - name: Lint with ruff
        run: ruff check adaptive_reflow/ tests/
      - name: Run pytest (non-slow, non-benchmark)
        run: PYTHONPATH=. python -m pytest tests/ -m "not slow and not benchmark" --no-header -q
      - name: Run universal-import guard
        # T-04.2: file was previously referenced as
        # ``test_universal_imports_no_molecular.py`` — that file does not
        # exist; the canonical guard lives at ``test_no_molecular_import.py``.
        run: PYTHONPATH=. python -m pytest tests/test_universal/test_no_molecular_import.py --no-header -q
      - name: Run eval-abstraction tests (FID + CLIP)
        # r17-survey: explicit wire-in of the canonical abstraction tests so
        # branch-protection rules pinned to this exact filename do not lose
        # coverage when the broad ``tests/`` discovery is filtered out.
        # test_fid_theorem_aligned.py pins the JMAA-Theorem-1 obligations
        # (PaperQuantitiesSnapshot byte-stability, per-round FID envelope,
        # convergence-rate bound, reference-registry cache hit, legacy
        # back-compat) that the phase-3 redesign (P-04) added on top of the
        # legacy single-shot FID abstraction regression-tested by
        # test_fid_abstraction.py.
        run: PYTHONPATH=. python -m pytest tests/test_eval/test_fid_abstraction.py tests/test_eval/test_fid_theorem_aligned.py tests/test_eval/test_clip_score_abstraction.py --no-header -q
      - name: Run tool entry-point tests (mol-eval + image-eval)
        # r17-survey: explicit wire-in of the new ``run_*_eval.py`` driver
        # tests so a regression in either entry point fails the watchdog
        # even if the broader discovery sweep is masked by markers.
        # P0-3: include the safe-wrapper test so the RLIMIT_AS wrapper's
        # argparse + cap-banner path is exercised in CI (no GPU needed).
        run: PYTHONPATH=. python -m pytest tests/test_tools/test_run_mol_eval.py tests/test_tools/test_run_mol_eval_safe.py tests/test_tools/test_run_image_eval.py --no-header -q
      - name: Check docs against code
        run: PYTHONPATH=. python tools/check_docs_against_code.py