name: stress-nightly

on:
  schedule:
    # Monday 03:00 UTC — fires after the mutation-nightly job and gives
    # the weekend mutation run time to upload artifacts before stress
    # tests reuse the same runner quota.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_PROFILE: stress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -e .[test] || pip install pytest hypothesis pytest-benchmark
      - name: Run stress tests
        # T-04.3: ``.venv/Scripts/python.exe`` is a Windows path; the
        # stress runner is Linux-only (``ubuntu-latest``). Use ``python``
        # so the gate does not silently fail when scheduled.
        run: python -m pytest -m stress --no-header -q
