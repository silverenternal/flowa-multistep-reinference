# mkdocs configuration for the flowa-multistep-reinference API reference.
#
# The ``docs/api/*.md`` pages are AUTO-GENERATED by mkdocstrings: each one
# contains ``::: adaptive_reflow.<subpackage>`` directives that pull in the
# module-level docstrings + typed signatures straight from the source
# tree. The pages themselves are not hand-authored -- they should never
# carry content that diverges from the code (the
# ``tools/check_docs_against_code.py`` linter explicitly excludes
# ``docs/api/`` for this reason; see the note in that file's scanner
# exclusion list).
#
# The hand-authored governance docs (``ARCHITECTURE.md``,
# ``docs/TESTING_STRATEGY.md``, etc.) live alongside the auto-generated
# pages so the same ``mkdocs serve`` session renders the whole project.

site_name: "flowa-multistep-reinference API"
site_description: >-
  Auto-generated API reference + governance docs for the
  flowa-multistep-reinference typed-contracts framework and Flow
  Matching ODE re-inference engine.

# ``docs_dir`` is the standard ``docs/`` subdirectory. mkdocs requires
# the docs directory to be a child (not the parent) of the config file
# directory, so we cannot set ``docs_dir: .`` to pick up repo-root
# governance docs. The workaround for ``ARCHITECTURE.md`` (which lives
# at the repo root) is a junction inside ``docs/`` pointing to
# ``../ARCHITECTURE.md`` -- this keeps a single source of truth at the
# repo root while letting mkdocs see it as a sibling of ``api/``,
# ``adr/``, and ``TESTING_STRATEGY.md``. mkdocstrings itself walks
# ``adaptive_reflow/`` via the Python handler (independent of
# ``docs_dir``) so the source-extraction path is unaffected.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
    - content.code.annotate

nav:
  # Paths are relative to ``docs_dir`` (``docs/``). Top-level repo
  # files like ``ARCHITECTURE.md`` are exposed via the ``docs/``
  # junction created at setup time so a single source of truth lives
  # at the repo root.
  - Home: api/index.md
  - User guide:
      - Tutorial: TUTORIAL.md
      - Plug in your model: PLUG_IN_YOUR_MODEL.md
      - Algorithms catalog: ALGORITHMS.md
  - Reference:
      - Run profiles (configs/runs/): configs.md
  - API reference:
      - Contracts: api/adaptive_reflow.contracts.md
      - Universal: api/adaptive_reflow.universal.md
      - Frame: api/adaptive_reflow.frame.md
      - Molecular: api/adaptive_reflow.molecular.md
      - Eval: api/adaptive_reflow.eval.md
      - Adapters: api/adaptive_reflow.adapters.md
  - Architecture:
      - System overview: ARCHITECTURE.md
      - Environment setup: environments.md
      - Framework scope strategy: STRATEGY_FRAMEWORK_SCOPE.md
      - Adapter dependencies: adapter-dependencies.md
      - Algorithm implementation notes (中文): 算法实现说明.md
  - Models (F.4 model cards):
      - 2D Rectified Flow: models/twodim_fm.model_card.md
      - CIFAR-10 Rectified Flow: models/rectified_flow_cifar.model_card.md
      - Self-Flow (ICML 2026): models/self_flow.model_card.md
      - FlowMol3 (Dunn & Koes 2025): models/flowmol3.model_card.md
      - LineageFlow (ICML 2026 protein): models/lineageflow.model_card.md
      - Kanzi (ICLR 2026 protein flow-AE): models/kanzi.model_card.md
      - FreqFlow (CVPR 2026 image): models/freqflow.model_card.md
      - Capability G.1 analysis: capability_g1_analysis.md
      - Theory deviations: theory/DEVIATIONS.md
  - Testing: TESTING_STRATEGY.md
  - Acceptance gates: GATES.md
  - Results & records:
      - Metric ledger (single source of truth): METRIC_LEDGER.md
      - Consolidated experimental results: CONSOLIDATED_RESULTS.md
      - Wave-6 reproducibility record: reproducibility_record.md
      - Wave-14 baseline audit report: baseline-audit-report.md
  - Governance audits:
      - 01 — code-organisation audit: governance/01-code-org-audit.md
      - 02 — algorithm audit: governance/02-algorithm-audit.md
      - 03 — framework audit: governance/03-framework-audit.md
      - 04 — test + CI audit: governance/04-test-ci-audit.md
      - 05 — fix plan: governance/05-fix-plan.md
      - 06 — verification report: governance/06-verification-report.md
      - Audit index (topic-cluster): audit/INDEX.md
      - Audit INDEX maintenance: audit/INDEX_MAINTENANCE.md
      - Current audit records:
          - Engineering audit: audit/engineering-audit-2026-09-13.md
          - Framework/model gap CPU audit: audit/framework-model-gap-cpu-2026-09-13.md
          - TODO six-plan status: audit/todo-six-plan-status-2026-09-13.md
          - TODO status reconciliation: audit/todo-status-reconciliation-2026-09-13.md
          # 2026-10-21: 17 entries in this block pointed at audit records that no
          # longer exist on disk (all 2026-09-13 snapshot names). They were removed
          # rather than restored; docs/audit/INDEX.md is the maintained map.
      - Development workflow: FLOWA_WORKFLOW.md
  - Paper-supporting survey (r4-survey):
      - Phase-4 code review: r4-survey/18-comprehensive-code-review.md
      - Phase-4 fix plan: r4-survey/19-fix-plan.md
      - Phase-4 docstring audit: audit/PHASE4_DOCSTRING_AUDIT.md
      - Phase-4 fix-v2 plan: r4-survey/21-fix-v2-plan.md
      - Phase-4 fix-v2 results: r4-survey/22-fix-v2-results.md
  - Paper-supporting survey (r17-survey):
      - Image-eval plan: r17-survey/image-eval-plan.md
      - Image comparison: r17-survey/img-comparison.md
      - Mol comparison: r17-survey/mol-comparison.md
      - Prot comparison: r17-survey/prot-comparison.md
      - Paper table template: r17-survey/paper-table-template.md
      - SOTA adapter audit: r17-survey/sota-adapter-audit.md
      - Data/weights inventory: r17-survey/data-weights-inventory.md

plugins:
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            # Docstring sections (Args / Returns / Raises) are folded
            # under the heading rather than dumped as plain prose.
            docstring_section_style: table
            # Headings use the ``heading_level:`` option per directive
            # (so each subpackage page can dial down to ``##`` even if
            # the rest of the doc is ``#``). ``toc_label`` is left at
            # its default so the nav tree shows the same name as the
            # class itself.
            heading_level: 1
            # Walk ``__mro__`` so inherited dataclass fields, Protocol
            # methods inherited from the stdlib (``Protocol``,
            # ``RuntimeCheckable``), and ``__init__`` overrides pulled
            # in from a base class appear in the rendered reference --
            # the Python handler uses griffe to enumerate members and
            # this flag is what turns on the inherited portion of the
            # walk. Per-internal-module directives under
            # ``docs/api/*.md`` rely on this so symbols that are not
            # re-exported at the subpackage ``__init__.py`` level still
            # show up.
            inherited_members: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

# ``--strict`` makes mkdocs fail on missing nav entries, broken internal
# links, and unresolved mkdocstrings references. CI passes
# ``--strict`` so doc drift is caught at PR time.
strict: true


# Exclude archived docs from the mkdocs build entirely. ARCHIVE/ holds
# historical context that is intentionally not part of the live site.
exclude_docs: |
  ARCHIVE/**
  ARCHIVE/audit-by-wave/**

# The ``docs/`` directory contains many pages beyond the four nav
# entries (ADRs, ``ADAPTER_INTERFACE_SPEC.md``, ``DEPRECATION.md``, ...)
# that are intentionally NOT in the top-level nav -- they are linked
# from the auto-generated reference as needed but are not the primary
# landing surface. We use ``not_in_nav`` to mark each one as expected-
# omitted (so the strict build does not flag it) and silence the
# cross-doc broken-link warnings for the repo-root files that are
# referenced via ``../`` from inside ``docs/`` but are not part of
# this site (they live at the repo root and are read directly from
# disk by the doc-claim linter, not by mkdocs).
