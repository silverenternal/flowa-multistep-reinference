# mkdocs configuration for the flowa-multistep-reinference API reference.
#
# The ``docs/api/*.md`` pages are AUTO-GENERATED by mkdocstrings: each one
# contains ``::: adaptive_reflow.<subpackage>`` directives that pull in the
# module-level docstrings + typed signatures straight from the source
# tree. The pages themselves are not hand-authored -- they should never
# carry content that diverges from the code (the
# ``tools/check_docs_against_code.py`` linter explicitly excludes
# ``docs/api/`` for this reason; see the note in that file's scanner
# exclusion list).
#
# The hand-authored governance docs (``ARCHITECTURE.md``,
# ``docs/TESTING_STRATEGY.md``, etc.) live alongside the auto-generated
# pages so the same ``mkdocs serve`` session renders the whole project.

site_name: "flowa-multistep-reinference API"
site_description: >-
  Auto-generated API reference + governance docs for the
  flowa-multistep-reinference typed-contracts framework and Flow
  Matching ODE re-inference engine.

# ``docs_dir`` is the standard ``docs/`` subdirectory. mkdocs requires
# the docs directory to be a child (not the parent) of the config file
# directory, so we cannot set ``docs_dir: .`` to pick up repo-root
# governance docs. The workaround for ``ARCHITECTURE.md`` (which lives
# at the repo root) is a junction inside ``docs/`` pointing to
# ``../ARCHITECTURE.md`` -- this keeps a single source of truth at the
# repo root while letting mkdocs see it as a sibling of ``api/``,
# ``adr/``, and ``TESTING_STRATEGY.md``. mkdocstrings itself walks
# ``adaptive_reflow/`` via the Python handler (independent of
# ``docs_dir``) so the source-extraction path is unaffected.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
    - content.code.annotate

