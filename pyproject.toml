# PEP 621 build-system declaration. ``hatchling`` is the build backend
# because (1) it ships a permissive ``only-include`` filter that lets us
# ship the runtime package + the ``tools/`` entry points without dragging
# the 1300+-line ``adaptive_reflow/legacy/`` quarantine into the wheel,
# (2) it is the default backend for projects that opt into hatch-style
# PEP 621 metadata, and (3) ``pip`` resolves the build-system entry from
# ``requires`` alone -- a PEP 517 install via ``pip install .`` does not
# require hatch to be pre-installed locally for ``build`` to pick it up.
# ``build-system.requires`` is the exact list of frontend/back-end plugins
# ``build`` must provision before invoking the backend; ``build-system.backend``
# is the dotted path to the build entry point hatchling exposes
# (``hatchling.build``).
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
# PEP 621 project metadata. The package itself is intentionally
# metadata-light: ``name`` is required for ``pip install -e .`` to work;
# ``version`` is bumped by hand; ``optional-dependencies.dev`` carries
# the doc-build toolchain (mkdocs + mkdocstrings) that the CI / pre-merge
# pipeline uses to render the auto-generated API reference under
# ``docs/api/``.
name = "flowa-multistep-reinference"
version = "0.1.0"
description = "Typed-contracts framework + Flow Matching ODE re-inference engine."
requires-python = ">=3.12"
# SPDX expression is the PEP 639 canonical form. ``MIT`` matches the
# ``LICENSE`` file shipped at the repo root; ``license-files`` globs
# both the canonical ``LICENSE`` and the ``LICENSE-*`` variant pattern
# so a future re-licensing swap (e.g. MIT -> Apache-2.0) only requires
# adding the new file under a matching glob, not editing ``pyproject.toml``.
license = "MIT"
license-files = ["LICENSE", "LICENSE-*"]
# ``readme`` is what PyPI renders on the project landing page. The README
# is the only long-form document we expose -- the rest of the project
# documentation lives under ``docs/`` and is published via mkdocs + GitHub
# Pages (see [project.urls].Documentation below).
readme = "README.md"
# Authors follow PEP 621 name+email table syntax. ``name`` is optional but
# ``email`` must be a valid RFC-822 address (PyPI rejects anything else).
# Copyright holder for LICENSE is the same individual.
authors = [
    {name = "silverenternal", email = "silverenternal@users.noreply.github.com"},
]
# Keywords surface in the PyPI sidebar search. Plurals chosen to match
# the canonical PyPI taxonomy (``flow-matching`` and ``reinference`` are
# one canonical form each; ``machine-learning`` is the long-form variant
# of the shorter ``ml``).
keywords = [
    "flow-matching",
    "reinference",
    "machine-learning",
    "contracts",
    "typed",
    "research",
]
# Classifiers follow PyPI's controlled vocabulary
# (https://pypi.org/classifiers/). We pick the closest match for a
# research-stage prototype that runs on Python 3.12 only: ``Development
# Status :: 3 - Alpha`` is honest about the B+ self-assessment in
# README.md; the three ``Intended Audience`` lines cover the three
# audiences the README explicitly names (research, science, education);
# the two ``Topic`` lines cover the algorithm-flavour and ML-flavour
# readers; ``Typing :: Typed`` advertises the typed-contracts core.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

# Project URLs surface in the PyPI sidebar. ``Homepage`` is the GitHub
# landing page (canonical source); ``Repository`` is the git clone URL
# (also used by ``pip`` for editable installs); ``Documentation`` is the
# rendered mkdocs site (the long-form docs do not live in README.md);
# ``Issues`` is the GitHub issue tracker.
[project.urls]
Homepage = "https://github.com/silverenternal/flowa-multistep-reinference"
Repository = "https://github.com/silverenternal/flowa-multistep-reinference.git"
Documentation = "https://silverenternal.github.io/flowa-multistep-reinference/"
Issues = "https://github.com/silverenternal/flowa-multistep-reinference/issues"
Changelog = "https://github.com/silverenternal/flowa-multistep-reinference/blob/main/CHANGELOG.md"

# Project scripts. ``claims-consistency`` is the CLI entry point for
# ``tools/check_claims_consistency.py``: it walks ``docs/CLAIMS.md``,
# verifies every ``Asserted by`` reference resolves to a real
# file:line, auto-promotes any ``Disputed by`` reference to
# ``PROVISIONAL``, and cross-checks each ACTIVE claim against the
# governance surfaces (INSIGHTS / ABLATION / ADR / README /
# ARCHITECTURE) for ``[CLM-NNN]`` tags. Exits ``0`` on clean,
# ``1`` on drift. Pair with ``check-docs-against-code`` as the two
# docs-drift gates the pre-merge hook runs.
[project.scripts]
claims-consistency = "tools.check_claims_consistency:main"

[project.optional-dependencies]
# Doc-build dev toolchain. ``mkdocstrings[python]`` pulls in the Python
# handler that auto-renders module-level docstrings + typed signatures
# from the ``adaptive_reflow.*`` subpackages. ``griffe`` is mkdocstrings'
# signature-extraction back-end (transitive dependency of
# ``mkdocstrings[python]``) but is declared explicitly so the
# per-internal-module directives that reach into ``adaptive_reflow.frame.merge``,
# ``adaptive_reflow.contracts.bundle``, etc. (rather than only the public
# ``__init__`` re-exports) are visible in the rendered reference -- the
# Python handler uses griffe to walk the AST and pull symbols that are
# not re-exported at the top level. Pinned with ``>=`` so minor upgrades
# flow through automatically (the docs build is hermetic and any
# breaking change will fail ``mkdocs build --strict``).
dev = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
    "griffe>=1.0",
    # ``hypothesis`` is added to ``dev`` (B.7 property-based testing —
    # ``framework-internal-metrics.md`` rev 2 §1.B.7) so a
    # ``pip install -e .[dev]`` brings the property-based test runner
    # without requiring the full ``[test]`` extra. ``[test]`` keeps the
    # canonical entry; ``[dev]`` is a convenience install that mirrors
    # the original author-time workflow of "mkdocs for docs + hypothesis
    # for property tests + ruff/mypy via the dev shell".
    "hypothesis>=6.0",
    # ``mutmut`` is the Python point-mutation tester used by the F.6
    # quarterly ML-aware mutation audit (``tools/run_mutation_audit.py``).
    # Pinned ``>=2.4`` for the modern mutmut2 AST-only design (the legacy
    # mutmut 1.x regenerates source files and was unreliable on Windows
    # per ``tools/mutate/WINDOWS_LIMITATION.md``). F.6 is quarterly by
    # design so the tool is dev-only and never required at runtime.
    "mutmut>=2.4",
]
# Chemistry-only extra: RDKit is a heavyweight dependency (~25 MB
# compiled wheel + numpy + Pillow) that only the
# :mod:`adaptive_reflow.eval.rdkit_oracle` module needs. The synthetic
# oracle (``adaptive_reflow.eval.synthetic_oracle``) covers the
# canonical DTB-R7 / DTB-R8 evaluation surface without it; this extra
# is for callers who want the real cheminformatics oracle. NOT a
# dev-dependency because it is a chemistry-domain optional feature.
chemistry = [
    "rdkit>=2024.3.1",
]
# Flow-matching-only extra: the 2D rectified-flow adapter and its offline
# trainer (``adaptive_reflow.adapters.twodim_fm_train``) need NumPy for
# the velocity-field MLP and SciPy for the sampling/diagnostic helpers.
# The rest of the framework is stdlib-only, so this stays an opt-in
# model-specific extra (same pattern as ``chemistry``) rather than a
# dev-dependency. NumPy is pinned ``<2.5`` because NumPy 2.5+ ships a
# PEP 695 ``type`` statement in ``__init__.pyi`` that mypy 1.x cannot
# parse; NumPy 2.0.x through 2.4.x are syntactically
# compatible with mypy 1.x.
flow_matching = [
    "numpy>=2.0,<2.5",
    "scipy>=1.10",
]
# Test-only extra: closes T-04.4 — the workflows (``cpu-tests.yml``,
# ``docs-validate.yml``, ``stress-nightly.yml``, ``bench-regression.yml``,
# ``mutation-nightly.yml``) historically call ``pip install -e .[test]``
# but the extra was never declared, so ``pip`` silently skipped the
# install and each workflow fell back to an explicit
# ``pip install pytest hypothesis pytest-benchmark`` step. Declaring
# the extra makes the workflow ``pip install -e .[test]`` line actually
# resolve, removes the duplication, and gives contributors a single
# documented ``pip install -e .[test,dev]`` recipe for full local CI.
# ``pytest-benchmark`` is included so the bench-regression workflow
# works without a second install step.
test = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-benchmark>=4.0",
]
# Image-FID-only extra: closes P0-1 — the canonical InceptionV3 feature
# extractor (:func:`tools.run_image_eval.load_inception_for_fid`)
# requires :mod:`torchvision` to construct
# ``tvm.inception_v3(weights=IMAGENET1K_V1, ...)``. Without torchvision
# the call fails loud with an ``ImportError`` listing the missing
# dependency (see :meth:`InceptionV3FIDEvaluator.__init__`). The
# framework's chemistry + flow-matching paths are stdlib-only; this
# extra keeps torchvision out of the default install footprint (~50 MB
# compiled + the IMAGENET1K_V1 weights download of ~109 MB cached under
# ``~/.cache/torch/hub/checkpoints/``). Pin ``<1.0`` to avoid the
# torchvision-1.0+ InceptionV3 weight-format break. ``pytorch-fid`` is
# deliberately NOT included here — the TF-aligned reference path at
# :func:`tools.run_sota_cifar_experiment._compute_fid_tfport_inline` is
# opt-in (only needed when paper-comparable scores against TF-FID
# literature are required) and gates on ``pytorch_fid`` importability.
image-fid = [
    "torchvision>=0.15,<1.0",
]

[tool.pytest.ini_options]
# Pytest configuration for adaptive_reflow. ``markers`` documents the
# custom markers the suite relies on; ``addopts`` makes pytest fail on
# unknown markers (``--strict-markers``) so a typo in a marker name is
# caught at collection time rather than silently filtered.
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "benchmark: benchmark tests (run with --benchmark-only)",
    "property: property-based tests",
    "adversarial: adversarial-case tests",
    "stress: long-horizon tests that run on stress-nightly CI only",
    "experiments: experimental claim reproduction tests (see docs/r5-survey/)",
]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.pytest-benchmark]
# Default tuning for pytest-benchmark across the suite. These defaults
# trade wall-clock for statistical confidence: ``min_rounds`` guarantees
# we capture at least five rounds even when each round is fast, and
# ``max_time`` bounds the total wall-clock budget so a CI run never
# blows up. ``warmup`` runs ten pre-iterations that are excluded from
# the reported statistics — this keeps the JIT / first-cache-warm-up
# noise out of ``mean``/``median``.
min_rounds = 5
max_time = 5.0
warmup = true
warmup_iterations = 10
sort = "mean"
columns = ["min", "median", "mean", "max", "stddev", "rounds", "iterations"]
show_relativ = true

[tool.hypothesis]
# Property-based test profile. ``max_examples=500`` gives broad coverage
# of the typed-contracts core without making CI unmanageably slow;
# ``deadline=2000`` ms accommodates the slower ``mypy --strict``-typed
# universal/molecular code paths (round-trip shrink of
# ``RestartMixer`` sketches can take >1s on first compile); the
# ``too_slow`` health check is suppressed because the universal
# ``RoundResultBundle`` round-trip can legitimately exceed Hypothesis's
# default 1.5 example/s throughput on Windows where file IO is slower.
max_examples = 500
deadline = 2000
suppress_health_check = ["too_slow"]

[tool.hypothesis.profiles."slow"]
# Slower Hypothesis profile used for tests marked ``slow``. Halves the
# example count to keep PR-time CI within budget while still exploring
# deeper property boundaries on the typed-contracts shrink logic; the
# ``deadline`` health check is also suppressed because long-running
# shrink attempts routinely exceed 2 s on Windows.
max_examples = 200
deadline = 30000
suppress_health_check = ["too_slow", "deadline"]

[tool.hypothesis.profiles."stress"]
# Stress profile reserved for the ``stress`` marker and the
# stress-nightly workflow. Example count is intentionally small (50) but
# the per-example deadline balloons to 60 s so adversarial boundary
# cases in the universal/molecular round-trip machinery get a fair
# chance to shrink rather than being filtered out.
max_examples = 50
deadline = 60000
suppress_health_check = ["too_slow", "deadline", "filter_too_much"]

[tool.ruff]
# Govern the flowa-multistep-reinference package layout. See
# ARCHITECTURE.md for the dependency-direction rules and
# FILE_MAPPING.md for the file inventory.
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "docs",
    "ARCHITECTURE*.md",
    "FILE_MAPPING.md",
    "SPLIT_NOTES.md",
    "CONTRACTS.md",
    "DESIGN_BOUNDARY.md",
    "STATUS.md",
    "README.md",
    "todo.json",
]

[tool.ruff.lint]
# Project-specific lint selection. The default rule set is too noisy for
# a typed-contracts framework; we keep the rules that catch real defects
# and silence the ones that don't.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # flake8-simplify
]
ignore = [
    "F401", # unused-import in __init__.py re-exports (handled via per-file-ignores)
    "E501", # line too long (handled by formatter)
    "B008", # function-call-in-default-argument (used intentionally for callable defaults)
    # UP040 (PEP 695 ``type`` statement) became active with
    # ``target-version = "py312"``. The two ``TypeAlias`` declarations it
    # flags -- ``universal.adapter.RestartPolicy`` and
    # ``molecular.contracts_RoundResultBundle`` -- are deliberate
    # import-cycle breakers, not stale syntax: both are paired with a
    # runtime placeholder / lazy resolution that a PEP 695 ``type``
    # statement (a lazily-evaluated ``TypeAliasType``, not a plain
    # assignment) would change the runtime semantics of. ruff classes the
    # rewrite as an unsafe fix for the same reason. Revisit only alongside
    # the contracts <-> molecular cycle removal tracked in ROADMAP.md.
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` re-exports are intentional public API surface; ruff
# sees them as "unused" but they are required.
"**/__init__.py" = ["F401", "E402"]
# Tests frequently import from adaptive_reflow.* without using every
# symbol; that's normal in test fixtures. E402 is allowed because
# test files sometimes split imports by section (e.g. ``# Imports``
# vs ``# Fixtures``) and may place a lazy import between fixtures.
"tests/**/*.py" = ["F401", "F811", "F821", "B008", "E402"]
# The legacy subpackage is quarantined; new lint rules are not enforced
# there until each file is modernized.
"adaptive_reflow/legacy/**/*.py" = ["F", "B", "SIM", "UP", "TRY", "BLE"]
# The contracts subpackage re-exports its public API from each split
# file; forward references between sibling modules (PhaseState in
# bundle.py, FinalRestartPolicy in hashes.py, etc.) are intentional
# and rely on `from __future__ import annotations`. ruff 0.16's F821
# reports these as false positives. E402 is allowed for the lazy
# ``__getattr__`` re-export shim of the molecule-aware atomic source
# bundle (``RoundResultBundle``) which breaks the import cycle between
# ``contracts.bundle`` and ``molecular.bundle``.
"adaptive_reflow/contracts/**/*.py" = ["F401", "F821", "E402"]
# The universal subpackage is the model-family-agnostic core; it uses
# ``__getattr__`` lazy re-exports and forward references (e.g.
# ``AdapterCapabilities`` inside ``StateBundle``) that ruff cannot
# resolve at parse time. F401 covers the intentional re-exports in
# ``__init__.py``; F821 covers the forward references; E402 covers the
# lazy ``__getattr__`` re-export shims.
"adaptive_reflow/universal/**/*.py" = ["F401", "F821", "E402"]
# The molecular subpackage is the molecule concrete layer. It uses
# lazy ``__getattr__`` re-exports and forward references between
# sibling modules (``molecular.bundle`` ↔ ``molecular.channels``). F401
# covers the intentional re-exports; F821 covers the forward references;
# E402 covers the lazy import shims that break the
# ``molecular.*`` ↔ ``contracts.*`` import cycle. E402 also covers
# the lazy ``_hash_trace_digest`` and ``_hash_artifact_func`` helpers
# that defer the ``contracts.hashes`` import.
"adaptive_reflow/molecular/**/*.py" = ["F401", "F821", "E402"]

# --- mypy --strict configuration -------------------------------------------
# The contracts and universal subpackages are the typed-contracts core; we
# run ``mypy --strict`` against them and silence only the categories that
# are noise (per project policy: ``type-arg`` for bare tuple/dict/list
# generics in NewType return types and helper signatures; ``no-any-return``
# for the ``RestartMixer`` skeleton whose ``native_blend_fn`` is
# adapter-supplied and intentionally untyped). Everything else (missing
# annotations, name-defined, arg-type) is treated as a real defect.
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
# Exclude third-party stub files with upstream syntax issues. RDKit ships
# rdMolDescriptors.pyi with a known PEP 613 syntax error; mypy aborts
# the whole run when it cannot parse a stub. Skipping the entire
# rdkit-stubs tree lets mypy focus on project code only.
exclude = [
    "venv/",
    "\\.venv/",
    "(^|/)rdkit-stubs/.*",
    "(^|/)site-packages/rdkit/.*",
    "(^|/)site-packages/numpy.*",
    "numpy",
    "site-packages.numpy.*",
    "(^|/)adaptive_reflow/eval/rdkit_oracle\\.py",
    "(^|/)adaptive_reflow/adapters/twodim_fm.*",
    "(^|/)adaptive_reflow/adapters/twodim_fm_train\\.py",
    "(^|/)adaptive_reflow/eval/twodim_fm_evaluator\\.py",
    # R5 scaffolded CIFAR adapter — torch-required UNet constructor and
    # torch.no_grad() inference path. Production analogue is twodim_fm.py
    # (also excluded). Both files are intentionally not mypy-strict-clean
    # until the [rf-cifar] extra is wired into the type-checking CI matrix.
    "(^|/)adaptive_reflow/adapters/rectified_flow_cifar\\.py",
]

[[tool.mypy.overrides]]
# The published Rectified-Flow DDPM++ topology subclasses ``torch.nn.Module``.
# ``torch`` is an optional ``[rf-cifar]`` extra and is absent from the
# type-checking environment, so ``ignore_missing_imports`` resolves
# ``nn.Module`` to ``Any`` and every layer trips ``subclass-any``. Only that
# one consequence is relaxed; the module stays otherwise strict.
module = ["adaptive_reflow.adapters._gnobitab_ddpmpp"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["adaptive_reflow.contracts.*", "adaptive_reflow.universal.*"]
disable_error_code = [
    "type-arg",
    "no-any-return",
]

# The ``legacy`` subpackage is quarantined: it predates the typed-contracts
# refactor and will be modernized file-by-file. Until then, silence the
# three error categories that the legacy ``defensive parsing`` helpers
# routinely produce (``arg-type`` for ``float()/int()`` over dynamically-
# typed ``Mapping[str, Any]`` payloads; ``var-annotated`` for the empty
# ``policy`` branch in ``condition_policy_parameters_from_feedback``;
# ``assignment`` for the same ``Mapping → dict`` narrowing on the same
# branch).
[[tool.mypy.overrides]]
module = ["adaptive_reflow.legacy.metric_feedback"]
disable_error_code = [
    "arg-type",
    "var-annotated",
    "assignment",
]

# RDKit ships a stub file with a known upstream syntax error
# (rdMolDescriptors.pyi:10 — PEP 613). mypy aborts the whole run when
# it cannot parse a stub, so skip the entire rdkit-stubs tree. (Other
# RDKit stubs are syntactically valid; only rdMolDescriptors.pyi trips
# mypy 1.x.)
[[tool.mypy.overrides]]
module = ["rdkit.*", "rdkit_stubs.*"]
follow_imports = "skip"
ignore_errors = true

# The RDKit oracle module imports rdkit at module level for runtime use;
# the broken upstream stub (rdMolDescriptors.pyi) makes mypy abort the
# whole run. Exclude the rdkit_oracle module from mypy strict since:
#  (1) the import chain is correct and tested at runtime;
#  (2) the syntax error is upstream's bug, not ours;
#  (3) the module is only loaded when callers opt-in via the
#      [chemistry] extra dependency.
[[tool.mypy.overrides]]
module = ["adaptive_reflow.eval.rdkit_oracle"]
ignore_errors = true

# numpy ships typed stubs, but the project only consumes it through the
# opt-in [flow_matching] extra and annotates against ``npt.NDArray``;
# skipping the package keeps strict-mode runs independent of the
# installed numpy version.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
ignore_errors = true

# The 2D rectified flow adapter, trainer, and evaluator all import numpy
# at module level for runtime use; the upstream numpy stub syntax error
# breaks mypy parsing. Exclude these modules since:
#  (1) the import chain is correct and tested at runtime;
#  (2) the syntax error is upstream's bug, not ours;
#  (3) the modules are only loaded when callers opt-in via the
#      [flow_matching] extra dependency.
[[tool.mypy.overrides]]
module = [
    "adaptive_reflow.adapters.twodim_fm",
    "adaptive_reflow.adapters.twodim_fm_train",
    "adaptive_reflow.adapters.rectified_flow_cifar",
    "adaptive_reflow.eval.twodim_fm_evaluator",
]
ignore_errors = true

# --- hatchling wheel / sdist configuration ---------------------------------
# Hatchling auto-discovers Python packages from the project root, but the
# ``tools/`` directory is a *flat* layout (no nested package) that hatchling
# would otherwise exclude. ``only-include`` below forces the wheel to ship
# exactly three roots: the runtime ``adaptive_reflow/`` package, the
# ``tools/`` entry-point module (``tools.check_claims_consistency``), and
# the ``tests/`` tree. ``tests/`` is shipped for downstream consumers who
# want to re-run the suite without checking out the source tree; the
# runtime import graph never touches it.
#
# We deliberately do NOT include the ``site/`` (mkdocs rendered HTML),
# ``docs/_benchmark_ablation.md``, ``docs/_test_ablation_quick.md``, or
# any other ``docs/_*`` underscore-prefixed files. The mkdocs ``--strict``
# build never reads from the wheel, and shipping the rendered site would
# bloat the wheel by ~1 MB.
[tool.hatch.build.targets.wheel]
only-include = [
    "adaptive_reflow",
    "tools",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# sdist must mirror the wheel include set so ``pip install -e .`` (which
# goes through sdist -> wheel) sees the same files. The same
# ``README.md`` / ``CHANGELOG.md`` / ``LICENSE`` triad is included so the
# rendered PyPI landing page has its sources.
[tool.hatch.build.targets.sdist]
only-include = [
    "adaptive_reflow",
    "tools",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

